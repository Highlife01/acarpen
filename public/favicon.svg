<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Acarpen">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#0a1f47" />
      <stop offset="65%" stop-color="#040f26" />
      <stop offset="100%" stop-color="#020817" />
    </radialGradient>
    <linearGradient id="foldRightTop" x1="180" y1="25" x2="245" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cfdbed" />
      <stop offset="55%" stop-color="#eef4fb" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="foldRightBot" x1="235" y1="150" x2="295" y2="235" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c9d7ec" />
      <stop offset="38%" stop-color="#f2f6fc" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="swooshGrad" x1="7" y1="283" x2="351" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#007cf0" />
      <stop offset="52%" stop-color="#00a3ff" />
      <stop offset="100%" stop-color="#0dc0ff" />
    </linearGradient>
    <linearGradient id="winGrad" x1="190" y1="201" x2="190" y2="273" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08b0ff" />
      <stop offset="100%" stop-color="#0088f0" />
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="84" fill="url(#bgGlow)" />

  <g transform="translate(22, 54)">
    <!-- Upper-Right Leg of A (with 3D Apex Fold Shading) -->
    <path
      d="M205 9 Q207.5 10.5 209 13.5 L259 111 Q229 113 201 121 L180 68 Z"
      fill="url(#foldRightTop)"
    />

    <!-- Lower-Right Leg of A (below Swoosh Cutout) -->
    <path
      d="M225 165 Q251 151 276 144 L348 283 L287 283 Z"
      fill="url(#foldRightBot)"
    />

    <!-- Left Leg & Apex Ribbon of A -->
    <path
      d="M7 283 L150 15 Q154 7 164 7 L200 7 Q203.5 7 205 9 L180 68 L128 164 L48 265 Z"
      fill="#ffffff"
    />

    <!-- Dynamic Sky-Blue Swoosh Arc -->
    <path
      d="M7 283 C68 192 212 88 351 130 C245 112 132 182 73 283 Z"
      fill="url(#swooshGrad)"
    />

    <!-- 4-Pane PVC Window Icon Inside A -->
    <g fill="url(#winGrad)">
      <path d="M154 211 L164 201 L185 201 L185 232 L154 232 Z" />
      <rect x="194" y="201" width="31" height="31" rx="1.5" />
      <rect x="154" y="242" width="31" height="31" rx="1.5" />
      <rect x="194" y="242" width="31" height="31" rx="1.5" />
    </g>
  </g>
</svg>
